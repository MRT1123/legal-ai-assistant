# 法律智能助手 - Docker Compose 配置
# 启动: docker-compose up -d
# 查看日志: docker-compose logs -f
# 停止: docker-compose down

services:
  legal-ai:
    build: .
    container_name: legal-ai-assistant
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # 持久化向量数据库和 SQLite（容器删除后数据不丢失）
      - chroma_data:/app/app/data/chroma_db
      - sqlite_data:/app/app/data
    restart: unless-stopped

volumes:
  chroma_data:
  sqlite_data:
